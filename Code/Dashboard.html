      display: flex;

    }
    .dashboard-number {

    }
    .carousel {
  margin-top: 0;
  margin-bottom: 20px; /* Adds space after carousel */
}

.carousel-img {
  max-height: 400px;
  object-fit: cover;
  border-radius: 15px;
  margin-bottom: 10px; /* Adds space under each image */
}

  </style>

<script>
  // Automatically update Total Teachers count
  document.addEventListener("DOMContentLoaded", function() {
    const teachers = JSON.parse(localStorage.getItem('teachers')) || [];
    document.getElementById('teacherCount').innerText = teachers.length;

  </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const currentPath = window.location.pathname.split("/").pop();
    const navLinks = document.querySelectorAll('.nav-link');

    navLinks.forEach(link => {
      const linkPath = link.getAttribute('href');
      if (linkPath === currentPath) {
        link.classList.add('active');
        link.style.backgroundColor = '#198754'; // Green background for active link
        link.style.borderRadius = '8px';
      }
    });
  });
</script>
