<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2 class="mb-4">Delete Student</h2>
  <form>
    <div class="mb-3">
      <label for="deleteStudentId" class="form-label">Student ID</label>
      <input type="text" class="form-control" id="deleteStudentId" placeholder="Enter student ID to delete">
    </div>
    <button type="submit" class="btn btn-danger">Delete Student</button>
    <a href="student.html" class="btn btn-secondary">Back</a>
  </form>
</div>
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
    
      const id = document.getElementById('deleteStudentId').value;
    
      let students = JSON.parse(localStorage.getItem('students')) || [];
    
      const newStudents = students.filter(student => student.id !== id);
    
      if (newStudents.length !== students.length) {
        localStorage.setItem('students', JSON.stringify(newStudents));
        alert('Student Deleted Successfully!');
        window.location.href = 'student.html';
      } else {
        alert('Student ID not found!');
      }
    });
    </script>
    
</body>
</html>
