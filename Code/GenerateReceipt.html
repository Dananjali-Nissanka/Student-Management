<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student Payment Receipt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @media print {
      .no-print {
        display: none;
      }
    }
  </style>
  <!-- Include jsPDF and html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="p-4">

  <div class="container border p-4 rounded shadow">
    <h2 class="text-center mb-4">Student Payment Receipt</h2>
    <div id="receiptContent"></div>

    <div class="text-end mt-4 no-print">
      <button class="btn btn-primary" onclick="downloadReceipt()">Download Receipt</button>
    </div>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem('receiptData'));
    if (data) {
      const content = `
        <p><strong>Student Name:</strong> ${data.studentName}</p>
        <p><strong>Student ID:</strong> ${data.studentId}</p>
        <p><strong>Enrolled Modules:</strong></p>
        <ul>
          ${data.modules.map(m => `<li>${m}</li>`).join('')}
        </ul>
        <p><strong>Total Payment:</strong> ${data.total}</p>
        <p><em>Receipt generated on: ${new Date().toLocaleString()}</em></p>
      `;
      document.getElementById('receiptContent').innerHTML = content;
    } else {
      document.getElementById('receiptContent').innerHTML = '<p>No receipt data available.</p>';
    }

    async function downloadReceipt() {
      const { jsPDF } = window.jspdf;
      const receiptElement = document.querySelector('.container');

      // Convert HTML to canvas
      const canvas = await html2canvas(receiptElement);
      const imgData = canvas.toDataURL('image/png');

      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const imgProps = pdf.getImageProperties(imgData);
      const imgHeight = (imgProps.height * pageWidth) / imgProps.width;

      pdf.addImage(imgData, 'PNG', 0, 10, pageWidth, imgHeight);
      pdf.save('Student_Receipt.pdf');
    }
  </script>

</body>
</html>
