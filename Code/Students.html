<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <style>
    .dashboard-card {
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      color: white;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row" style="height: 100vh">

    <!-- Sidebar -->
    <div class="col-2 col-sm-3 col-xl-2 bg-dark p-0">
      <nav class="navbar bg-dark border-bottom border-white mb-3" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <i class="bi bi-house-check-fill"></i><span class="d-none d-sm-inline ms-2">ARIAL SCHOOL</span>
          </a>
        </div>
      </nav>

      <nav class="nav flex-column">
        <a class="nav-link text-white" href="dashboard.html">
          <i class="bi bi-bank2"></i><span class="d-none d-sm-inline ms-2">DASHBOARD</span>
        </a>
        <a class="nav-link text-white" href="Students.html">
          <i class="bi bi-person-arms-up"></i><span class="d-none d-sm-inline ms-2">STUDENT</span>
        </a>
        <a class="nav-link text-white" href="teacher.html">
          <i class="bi bi-person-gear"></i><span class="d-none d-sm-inline ms-2">TEACHER</span>
        </a>
        <a class="nav-link text-white" href="course.html">
          <i class="bi bi-book"></i><span class="d-none d-sm-inline ms-2">COURSE</span>
        </a>
        <a class="nav-link text-white" href="classroom.html">
          <i class="bi bi-building"></i><span class="d-none d-sm-inline ms-2">CLASSROOM</span>
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="col-10 col-sm-9 col-xl-10 p-0 m-0">
      <!-- Top Navbar -->
      <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container-fluid">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#"><i class="bi bi-arrow-bar-right me-2"></i>Logout</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Student Page Content -->
      <div class="container mt-4">
        <h2 class="text-center mb-4">Student List</h2>

        <!-- Search Bar -->
        <div class="position-relative mb-4">
          <input type="text" class="form-control pe-5" id="searchInput" placeholder="Search students">
          <i class="fas fa-search position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
        </div>
        

        <!-- Action Buttons -->
        <div class="mb-4 d-flex">
          <a href="AddStudent.html" class="btn btn-primary me-2">
            <i class="fas fa-plus"></i> Add Student
          </a>
          <a href="StudentPayments.html" class="btn btn-info me-2">
            <i class="fas fa-credit-card"></i> Payment Details
          </a>
        </div>

        <table class="table table-striped table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Full Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Class</th>
              <th>Modules</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Students will be populated here -->
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Scripts -->
<script>
  // Load students with optional filtering
  function loadStudents(filterText = '') {
    const students = JSON.parse(localStorage.getItem('students')) || [];
    const tbody = document.getElementById('studentTableBody');
    tbody.innerHTML = '';

    students
      .filter(student => {
        const searchString = `${student.fullName} ${student.age} ${student.gender} ${student.modules}`.toLowerCase();
        return searchString.includes(filterText.toLowerCase());
      })
      .forEach(student => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${student.studentId}</td>
          <td>${student.fullName}</td>
          <td>${student.age}</td>
          <td>${student.gender}</td>
          <td>${student.className}</td>
          <td>${student.modules}</td>
          <td>
            <button class="btn btn-info btn-sm me-2" onclick="viewStudent('${student.studentId}')">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-warning btn-sm me-2" onclick="editStudent('${student.studentId}')">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-danger btn-sm" onclick="deleteStudent('${student.studentId}')">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
  }

  // View student
  function viewStudent(studentId) {
    localStorage.setItem('viewStudentId', studentId);
    window.location.href = 'ViewStudent.html';
  }

  // Edit student
  function editStudent(studentId) {
    localStorage.setItem('editStudentId', studentId);
    window.location.href = 'EditStudent.html';
  }

  // Delete student
  function deleteStudent(studentId) {
    if (confirm('Are you sure you want to delete this student?')) {
      let students = JSON.parse(localStorage.getItem('students')) || [];
      students = students.filter(student => student.studentId !== studentId);
      localStorage.setItem('students', JSON.stringify(students));
      loadStudents();
    }
  }

  // Load students when page loads
  document.addEventListener('DOMContentLoaded', function () {
    loadStudents();

    document.getElementById('searchInput').addEventListener('input', function () {
      const filterText = this.value;
      loadStudents(filterText);
    });
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const currentPath = window.location.pathname.split("/").pop();
    const navLinks = document.querySelectorAll('.nav-link');

    navLinks.forEach(link => {
      const linkPath = link.getAttribute('href');
      if (linkPath === currentPath) {
        link.classList.add('active');
        link.style.backgroundColor = '#198754'; // Green background for active link
        link.style.borderRadius = '8px';
      }
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
