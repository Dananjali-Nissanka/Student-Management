<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Student</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    .dropdown-checkboxes {
      position: relative;
    }

    .dropdown-menu-checkboxes {
      max-height: 200px;
      overflow-y: auto;
    }

    .dropdown-checkbox-toggle {
      width: 100%;
      text-align: left;
      border: 1px solid #ced4da;
      border-radius: 0.375rem;
      background-color: #fff;
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      line-height: 1.5;
      cursor: pointer;
    }

    .dropdown-menu {
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row" style="height: 100vh;">

      <!-- Sidebar -->
      <div class="col-2 col-sm-3 col-xl-2 bg-dark p-0">
        <nav class="navbar bg-dark border-bottom border-white mb-3" data-bs-theme="dark">
          <div class="container-fluid">
            <a class="navbar-brand text-white" href="#">
              <i class="bi bi-house-check-fill"></i><span class="d-none d-sm-inline ms-2">ARIAL SCHOOL</span>
            </a>
          </div>
        </nav>

        <nav class="nav flex-column">
          <a class="nav-link text-white" href="dashboard.html"><i class="bi bi-bank2"></i><span class="d-none d-sm-inline ms-2">Dashboard</span></a>
          <a class="nav-link text-white" href="Students.html"><i class="bi bi-person-arms-up"></i><span class="d-none d-sm-inline ms-2">Student</span></a>
          <a class="nav-link text-white" href="teacher.html"><i class="bi bi-person-gear"></i><span class="d-none d-sm-inline ms-2">Teacher</span></a>
          <a class="nav-link text-white" href="course.html"><i class="bi bi-book"></i><span class="d-none d-sm-inline ms-2">Course</span></a>
          <a class="nav-link text-white" href="classroom.html"><i class="bi bi-building"></i><span class="d-none d-sm-inline ms-2">Classroom</span></a>
        </nav>
      </div>

      <!-- Main Content -->
      <div class="col-10 col-sm-9 col-xl-10 p-4">
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
          <div class="container-fluid">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="#"><i class="bi bi-arrow-bar-right me-2"></i>Logout</a>
              </li>
            </ul>
          </div>
        </nav>

        <div class="container">
          <h2 class="text-center mb-4">Update Student</h2>

          <div class="mx-auto" style="max-width: 600px;">
            <form id="updateForm" novalidate>

              <div class="mb-3">
                <label for="studentId" class="form-label">Student ID</label>
                <input type="text" class="form-control" id="studentId" disabled>
              </div>

              <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" required>
              </div>

              <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" class="form-control" id="age" min="1" required>
              </div>

              <div class="mb-3">
                <label for="gender" class="form-label">Gender</label>
                <select class="form-select" id="gender" required>
                  <option value="">Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="className" class="form-label">Class</label>
                <input type="text" class="form-control" id="className" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Learning Modules</label>
                <div class="dropdown-checkboxes">
                  <div id="selectedModulesDisplay" class="dropdown-checkbox-toggle" readonly>Select modules</div>
                  <div class="dropdown-menu border mt-1 p-2 dropdown-menu-checkboxes" id="moduleCheckboxes">
                    <label><input type="checkbox" value="Maths"> Mathematics</label><br>
                    <label><input type="checkbox" value="Science"> Science</label><br>
                    <label><input type="checkbox" value="English"> English</label><br>
                    <label><input type="checkbox" value="History"> History</label><br>
                    <label><input type="checkbox" value="Geography"> Geography</label><br>
                    <label><input type="checkbox" value="ICT"> ICT</label><br>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label for="guardianName" class="form-label">Guardian Name</label>
                <input type="text" class="form-control" id="guardianName" required>
              </div>

              <div class="mb-3">
                <label for="guardianEmail" class="form-label">Guardian Email</label>
                <input type="email" class="form-control" id="guardianEmail" required>
              </div>

              <div class="mb-3">
                <label for="emergencyContact" class="form-label">Emergency Contact</label>
                <input type="tel" class="form-control" id="emergencyContact" pattern="[0-9]{10}" required>
              </div>

              <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" rows="3" required></textarea>
              </div>

              <div class="text-center mt-4">
                <button type="submit" class="btn btn-warning px-4 py-2">Update Student</button>
              </div>

            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const editId = localStorage.getItem('editStudentId');
      const students = JSON.parse(localStorage.getItem('students')) || [];
      const student = students.find(s => s.studentId == editId);
  
      if (student) {
        document.getElementById('studentId').value = student.studentId;
        document.getElementById('fullName').value = student.fullName;
        document.getElementById('age').value = student.age;
        document.getElementById('gender').value = student.gender;
        document.getElementById('className').value = student.className;
  
        const selectedModules = student.modules.split(',').map(m => m.trim());
        const checkboxes = document.querySelectorAll('#moduleCheckboxes input[type="checkbox"]');
        checkboxes.forEach(cb => {
          if (selectedModules.includes(cb.value)) cb.checked = true;
        });
        updateModuleDisplay();
  
        document.getElementById('guardianName').value = student.guardianName;
        document.getElementById('guardianEmail').value = student.guardianEmail;
        document.getElementById('emergencyContact').value = student.emergencyContact;
        document.getElementById('address').value = student.address;
      }
    });
  
    // Toggle dropdown
    document.getElementById('selectedModulesDisplay').addEventListener('click', function () {
      const menu = document.getElementById('moduleCheckboxes');
      menu.classList.toggle('show');
    });
  
    // Close dropdown on outside click
    document.addEventListener('click', function (e) {
      if (!document.querySelector('.dropdown-checkboxes').contains(e.target)) {
        document.getElementById('moduleCheckboxes').classList.remove('show');
      }
    });
  
    // Update module display
    function updateModuleDisplay() {
      const selected = Array.from(document.querySelectorAll('#moduleCheckboxes input[type="checkbox"]:checked'))
        .map(cb => cb.value);
      document.getElementById('selectedModulesDisplay').textContent = selected.join(', ');
    }
  
    document.querySelectorAll('#moduleCheckboxes input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', updateModuleDisplay);
    });
  
    document.getElementById('updateForm').addEventListener('submit', function (e) {
      e.preventDefault();
  
      // Validate learning modules
      const selectedModules = Array.from(document.querySelectorAll('#moduleCheckboxes input[type="checkbox"]:checked')).length;
      if (selectedModules === 0) {
        alert('Please select at least one learning module.');
        return;
      }
  
      // If form is valid, proceed with the rest of the logic
      if (!this.checkValidity()) {
        this.classList.add('was-validated');
        return;
      }
  
      const id = document.getElementById('studentId').value;
      const fullName = document.getElementById('fullName').value;
      const age = document.getElementById('age').value;
      const gender = document.getElementById('gender').value;
      const className = document.getElementById('className').value;
      const modules = document.getElementById('selectedModulesDisplay').textContent;
      const guardianName = document.getElementById('guardianName').value;
      const guardianEmail = document.getElementById('guardianEmail').value;
      const emergencyContact = document.getElementById('emergencyContact').value;
      const address = document.getElementById('address').value;
  
      let students = JSON.parse(localStorage.getItem('students')) || [];
      const index = students.findIndex(student => student.studentId == id);
  
      if (index !== -1) {
        students[index] = {
          studentId: id,
          fullName,
          age,
          gender,
          className,
          modules,
          guardianName,
          guardianEmail,
          emergencyContact,
          address
        };
  
        localStorage.setItem('students', JSON.stringify(students));
        alert('Student Updated Successfully!');
        window.location.href = 'Students.html';
      } else {
        alert('Student ID not found!');
      }
    });
  </script>
  
</body>
</html>
