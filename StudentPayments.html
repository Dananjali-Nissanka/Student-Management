<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Payment Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid">
  <div class="row" style="height: 100vh">

    <!-- Sidebar -->
    <div class="col-2 col-sm-3 col-xl-2 bg-dark p-0">
      <nav class="navbar bg-dark border-bottom border-white mb-3" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <i class="bi bi-house-check-fill"></i><span class="d-none d-sm-inline ms-2">ARIAL SCHOOL</span>
          </a>
        </div>
      </nav>

      <nav class="nav flex-column">
        <a class="nav-link text-white" href="dashboard.html">
          <i class="bi bi-bank2"></i><span class="d-none d-sm-inline ms-2">DASHBOARD</span>
        </a>
        <a class="nav-link text-white" href="Students.html">
          <i class="bi bi-person-arms-up"></i><span class="d-none d-sm-inline ms-2">STUDENT</span>
        </a>
        <a class="nav-link text-white" href="teacher.html">
          <i class="bi bi-person-gear"></i><span class="d-none d-sm-inline ms-2">TEACHER</span>
        </a>
        <a class="nav-link text-white" href="course.html">
          <i class="bi bi-book"></i><span class="d-none d-sm-inline ms-2">COURSE</span>
        </a>
        <a class="nav-link text-white" href="classroom.html">
          <i class="bi bi-building"></i><span class="d-none d-sm-inline ms-2">CLASSROOM</span>
        </a>
        <a class="nav-link text-white" href="payment.html">
          <i class="bi bi-cash-stack"></i><span class="d-none d-sm-inline ms-2">PAYMENT</span>
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="col-10 col-sm-9 col-xl-10 p-0 m-0">
      <!-- Top Navbar -->
      <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container-fluid">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#"><i class="bi bi-arrow-bar-right me-2"></i>Logout</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Payment Details Section -->
      <div class="container mt-4">
        <h2 class="text-center mb-4">Payment Details</h2>

        <div class="border p-4 rounded bg-light mx-auto" style="max-width: 700px; text-align: left;">
          <div class="mb-3">
            <label for="studentSelect" class="form-label">Select Student:</label>
            <select class="form-control" id="studentSelect" onchange="loadModules()">
              <option value="">-- Select a Student --</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Enrolled Modules:</label>
            <ul id="moduleList" class="list-group"></ul>
          </div>

          <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-primary" onclick="calculateTotal()">
              <i class="fas fa-calculator me-1"></i> Calculate Total
            </button>
            <button class="btn btn-success" onclick="generateReceipt()">
              <i class="fas fa-receipt me-1"></i> Generate Receipt
            </button>
          </div>

          <h4>Total Payment: <span id="totalAmount">$0</span></h4>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const modulePrices = {
    Mathematics: 100,
    Science: 120,
    English: 90,
    History: 80,
    Geography: 95,
    ICT: 150
  };

  function loadStudents() {
    const students = JSON.parse(localStorage.getItem('students')) || [];
    const studentSelect = document.getElementById('studentSelect');

    students.forEach(student => {
      const option = document.createElement('option');
      option.value = student.studentId;
      option.textContent = `${student.fullName} (${student.studentId})`;
      studentSelect.appendChild(option);
    });
  }

  function loadModules() {
    const selectedStudentId = document.getElementById('studentSelect').value;
    const students = JSON.parse(localStorage.getItem('students')) || [];
    const student = students.find(s => s.studentId === selectedStudentId);
    const moduleList = document.getElementById('moduleList');
    moduleList.innerHTML = '';

    if (student && student.modules) {
      const modulesArray = student.modules.split(',').map(m => m.trim());

      modulesArray.forEach(module => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.textContent = module;
        moduleList.appendChild(li);
      });
    }
  }

  function calculateTotal() {
    const moduleItems = document.querySelectorAll('#moduleList li');
    let total = 0;

    moduleItems.forEach(item => {
      const moduleName = item.textContent;
      total += modulePrices[moduleName] || 0;
    });

    document.getElementById('totalAmount').innerText = '$' + total;
  }

  function generateReceipt() {
    const studentSelect = document.getElementById('studentSelect');
    const studentName = studentSelect.options[studentSelect.selectedIndex].text;
    const studentId = studentSelect.value;
    const modules = Array.from(document.querySelectorAll('#moduleList li')).map(li => li.textContent);
    const total = document.getElementById('totalAmount').innerText;

    if (!studentId || modules.length === 0 || total === '$0') {
      alert("Please select a student and calculate the total before generating a receipt.");
      return;
    }

    const receiptData = {
      studentName,
      studentId,
      modules,
      total
    };

    localStorage.setItem('receiptData', JSON.stringify(receiptData));
    window.open('GenerateReceipt.html', '_blank');
  }

  // Highlight current sidebar menu
  document.addEventListener('DOMContentLoaded', function () {
    loadStudents();
    const currentPath = window.location.pathname.split("/").pop();
    const navLinks = document.querySelectorAll('.nav-link');

    navLinks.forEach(link => {
      const linkPath = link.getAttribute('href');
      if (linkPath === currentPath) {
        link.classList.add('active');
        link.style.backgroundColor = '#198754';
        link.style.borderRadius = '8px';
      }
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
