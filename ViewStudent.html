<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
  <div class="row" style="height: 100vh">

    <!-- Sidebar -->
    <div class="col-2 col-sm-3 col-xl-2 bg-dark p-0">
      <nav class="navbar bg-dark border-bottom border-white mb-3" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <i class="bi bi-house-check-fill"></i><span class="d-none d-sm-inline ms-2">ARIAL SCHOOL</span>
          </a>
        </div>
      </nav>

      <nav class="nav flex-column">
        <a class="nav-link text-white" href="dashboard.html">
          <i class="bi bi-bank2"></i><span class="d-none d-sm-inline ms-2">DASHBOARD</span>
        </a>
        <a class="nav-link text-white" href="Students.html">
          <i class="bi bi-person-arms-up"></i><span class="d-none d-sm-inline ms-2">STUDENT</span>
        </a>
        <a class="nav-link text-white" href="teacher.html">
          <i class="bi bi-person-gear"></i><span class="d-none d-sm-inline ms-2">TEACHER</span>
        </a>
        <a class="nav-link text-white" href="course.html">
          <i class="bi bi-book"></i><span class="d-none d-sm-inline ms-2">COURSE</span>
        </a>
        <a class="nav-link text-white" href="classroom.html">
          <i class="bi bi-building"></i><span class="d-none d-sm-inline ms-2">CLASSROOM</span>
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="col-10 col-sm-9 col-xl-10 p-0 m-0">
      <!-- Top Navbar -->
      <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container-fluid">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#"><i class="bi bi-arrow-bar-right me-2"></i>Logout</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Student Details Section -->
      <div class="container mt-4">
        <h2 class="text-center mb-4">Student Details</h2>

        <div id="studentDetails" class="border p-4 rounded bg-light mx-auto" style="max-width: 700px; text-align: left;"></div>

        <div class="text-center mt-4">
          <button id="editBtn" class="btn btn-warning me-3">
            <i class="fas fa-edit"></i> Edit
          </button>
          <button id="deleteBtn" class="btn btn-danger">
            <i class="fas fa-trash"></i> Delete
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const studentId = localStorage.getItem('viewStudentId');
const students = JSON.parse(localStorage.getItem('students')) || [];
const student = students.find(s => s.studentId == studentId);

if (student) {
  document.getElementById('studentDetails').innerHTML = `
    <p><strong>Student ID:</strong> ${student.studentId}</p>
    <p><strong>Full Name:</strong> ${student.fullName}</p>
    <p><strong>Age:</strong> ${student.age}</p>
    <p><strong>Gender:</strong> ${student.gender}</p>
    <p><strong>Class:</strong> ${student.className}</p>
    <p><strong>Learning Modules:</strong> ${student.modules}</p>
    <p><strong>Guardian Name:</strong> ${student.guardianName}</p>
    <p><strong>Guardian Email:</strong> ${student.guardianEmail}</p>
    <p><strong>Emergency Contact:</strong> ${student.emergencyContact}</p>
    <p><strong>Address:</strong> ${student.address}</p>
  `;
}

document.getElementById('editBtn').addEventListener('click', function () {
  localStorage.setItem('editStudentId', student.studentId);
  window.location.href = 'EditStudent.html';
});

document.getElementById('deleteBtn').addEventListener('click', function () {
  if (confirm('Are you sure you want to delete this student?')) {
    let students = JSON.parse(localStorage.getItem('students')) || [];
    students = students.filter(s => s.studentId !== student.studentId);
    localStorage.setItem('students', JSON.stringify(students));
    window.location.href = 'Students.html';
  }
});
</script>

<script>
  // Active sidebar item styling
  document.addEventListener('DOMContentLoaded', function () {
    const currentPath = window.location.pathname.split("/").pop();
    const navLinks = document.querySelectorAll('.nav-link');

    navLinks.forEach(link => {
      const linkPath = link.getAttribute('href');
      if (linkPath === currentPath) {
        link.classList.add('active');
        link.style.backgroundColor = '#198754';
        link.style.borderRadius = '8px';
      }
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
